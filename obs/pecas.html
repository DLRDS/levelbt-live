<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Level BT Live · peças para o OBS</title>
<!-- GERADO POR obs/gerar.js — não edite à mão, edite o index.html e rode de novo -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --orange:#FF6600; --ink:#0D0D0D; --surf:#1A1A1A; --line:#2A2A2A;
    --label:#A8A8A8; --dim:#6B6B6B; --white:#FFFFFF; --danger:#FF4D4D;
    --fd:'Archivo Black',sans-serif; --fb:'Archivo',sans-serif; --fm:'JetBrains Mono',monospace;
  }
  body{font-family:var(--fb);background:var(--ink);color:var(--white);font-size:16px;-webkit-font-smoothing:antialiased;}

  /* Aviso de sincronia. Fora do ar é vermelho e fica; o "voltou" é verde
     e some em 6s — ele existe para o operador poder parar de se
     preocupar, não para ficar na tela o jogo inteiro. */
  #syncMsg.sync-fora{color:var(--danger);font-weight:600;}
  #syncMsg.sync-voltou{color:#39D98A;font-weight:600;}

  /* Estatísticas no controle: a mesma tabela da cartela, em tamanho de
     painel. Rótulo no meio, uma dupla de cada lado. */
  .stats .sh,.stats .sl{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:9px 0;
    border-bottom:1px solid var(--line);}
  .stats .sh{font-weight:700;font-size:14px;}
  .stats .sh .b,.stats .sl .v.b{text-align:right;}
  .stats .sl .r{font-family:var(--fm);font-size:10px;letter-spacing:.14em;color:var(--label);text-align:center;}
  .stats .sl .v{font-family:var(--fm);font-size:15px;}
  .stats .sl .v small{color:var(--dim);margin:0 6px;}
  .stats .sl .v.lid{color:var(--orange);}
  .stats .base{font-family:var(--fm);font-size:11px;letter-spacing:.1em;color:var(--dim);margin-top:10px;line-height:1.5;}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  input,select{font:inherit;color:inherit;}

  /* ═════════ MODO CONTROLE (celular) ═════════ */
  .wrap{max-width:520px;margin:0 auto;padding:20px 20px calc(24px + env(safe-area-inset-bottom));padding-top:calc(20px + env(safe-area-inset-top));}

  /* No celular o painel é uma coluna só, como sempre foi. */
  .painel{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .cln{display:flex;flex-direction:column;gap:10px;}

  /* ═════════ LAYOUT DE COMPUTADOR ═════════
     Quem opera a transmissão está sentado na frente do OBS, com espaço
     de sobra. Aqui o painel abre em três colunas e as gavetas ficam
     abertas: dá para ver o jogo, as cenas e a fila ao mesmo tempo,
     sem abrir e fechar nada.

     O modo é decidido no JS — pela largura da tela, ou pela escolha
     forçada no botão — e sai como classe no <html>. Por isso estas
     regras são de classe e não de @media: media query não dá para
     ligar e desligar na mão. O celular segue sendo o padrão do arquivo
     inteiro; aqui só existe o que o computador acrescenta. */
  .modo-pc body{font-size:16px;}
  /* min-width: forçar computador num celular mostra o layout de verdade
     e rola na horizontal, como o "ver versão para computador" do
     navegador. Sem isso tudo se esmaga e os textos se montam. */
  .modo-pc .wrap{max-width:1280px;min-width:1000px;padding-top:28px;}
  .modo-pc #setup, .modo-pc #linkbox{max-width:560px;margin-left:auto;margin-right:auto;}

  /* ── A MESA ───────────────────────────────────────────────────
     O preview manda: grande, à esquerda, é por ele que se decide
     tudo. Embaixo dele a botoeira de cenas. À direita, colada, a
     pontuação — que é o que a mão faz o tempo todo. O resto desce
     para o rodapé, onde só se mexe entre uma partida e outra. */
  /* Posição explícita em vez de áreas nomeadas: linha e coluna de cada
     bloco, sem depender de como o navegador casa os nomes. */
  .modo-pc .painel{display:grid;gap:14px;align-items:start;
    grid-template-columns:minmax(0,1.85fr) minmax(0,1fr);}
  .modo-pc .area-tv   {grid-column:1; grid-row:1;}
  .modo-pc .area-mesa {grid-column:1; grid-row:2;}
  .modo-pc .area-pts  {grid-column:2; grid-row:1 / span 2;}
  /* patrocinadores e fila são assuntos diferentes: cada um no seu
     cartão, lado a lado no rodapé */
  .modo-pc .area-patro{grid-column:1; grid-row:3;}
  .modo-pc .area-fila {grid-column:2; grid-row:3;}

  /* o preview não é um cartão entre outros: é a tela */
  .modo-pc .area-tv{background:none;border:none;padding:0;gap:10px;}
  .modo-pc .area-tv .tv{border-width:2px;border-radius:8px;}

  /* a pontuação ocupa a altura toda da coluna, empilhada */
  .modo-pc .area-pts .taps{flex-direction:column;}
  .modo-pc .area-pts .tap{padding:20px;}
  .modo-pc .area-pts .tap .big{font-size:72px;line-height:.85;}
  .modo-pc .area-pts .tap .mono{font-size:12px;}

  /* no rodapé as gavetas já são a própria seção: sem borda entre elas */
  .modo-pc .area-patro details+details,
  .modo-pc .area-fila  details+details{border-top:none;padding-top:0;}
  .modo-pc .cln{background:var(--surf);border-radius:24px;padding:18px;gap:14px;}

  /* a etiqueta do atalho não pode empurrar o placar para outra linha */
  .modo-pc .taps .mono{white-space:nowrap;}
  .modo-pc .taps .tecla{margin-left:6px;}

  /* dentro das colunas, as gavetas viram seções com título */
  .modo-pc .cln details{background:transparent;border:none;border-radius:0;padding:0;}
  .modo-pc .cln details+details{border-top:1.5px solid var(--line);padding-top:14px;}
  .modo-pc .cln summary{list-style:none;cursor:default;pointer-events:none;
    font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;color:var(--label);margin-bottom:12px;}
  .modo-pc .cln summary::-webkit-details-marker{display:none;}
  /* a de colar planilha continua sendo uma gaveta de verdade */
  .modo-pc .cln details details summary{pointer-events:auto;cursor:pointer;color:var(--orange);}

  .modo-pc #agdLista{max-height:340px;overflow-y:auto;}
  .modo-pc .cenas{grid-template-columns:1fr 1fr;}

  /* Atalhos de teclado: só fazem sentido com teclado de verdade */
  .tecla{display:none;}
  .modo-pc .tecla{display:inline-block;font-family:var(--fm);font-size:10px;font-weight:700;
    letter-spacing:.1em;border:1.5px solid var(--line);border-radius:6px;
    padding:2px 6px;color:var(--dim);margin-left:8px;vertical-align:middle;}

  /* ── PREVIEW DA LIVE ──────────────────────────────────────────
     Uma caixa 16:9 com o vídeo do YouTube embaixo e o overlay de
     verdade por cima, na mesma proporção do que vai ao ar. O overlay
     é o próprio arquivo rodando em modo overlay — então é exatamente
     o que o OBS recebe, não uma imitação. */
  .tv{position:relative;width:100%;aspect-ratio:16/9;background:#000;
    border:1.5px solid var(--line);border-radius:10px;overflow:hidden;}
  .tv-vazio{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:22px;text-align:center;font-size:14px;color:var(--dim);line-height:1.5;}
  .tv-video{position:absolute;inset:0;width:100%;height:100%;border:0;}
  /* o overlay não recebe clique: é vidro, não botão */
  .tv-over{position:absolute;inset:0;pointer-events:none;}
  .tv-over-f{width:1920px;height:1080px;border:0;transform-origin:top left;background:transparent;}
  .lnk{background:none;border:none;color:var(--orange);cursor:pointer;padding:0;}

  /* ── BARRA DE STATUS ──────────────────────────────────────────
     No celular é uma linha de texto; no computador vira a régua de
     estado de uma mesa de corte: no ar, partida, tempo e cena. */
  .barra{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px;}
  .barra-sep{display:none;}
  .barra-fim{margin-left:auto;color:var(--orange);}
  .num-sm{font-family:var(--fm);font-size:13px;font-weight:700;color:var(--white);letter-spacing:.06em;}
  .sig{display:none;align-items:center;gap:7px;background:var(--orange);color:var(--ink);
    padding:5px 11px;border-radius:4px;font-family:var(--fm);font-size:11px;
    font-weight:700;letter-spacing:.14em;}
  .sig i{width:7px;height:7px;border-radius:999px;background:var(--ink);display:block;
    animation:vivoPisca 1.4s steps(2,jump-none) infinite;}
  .sig.frio{background:var(--line);color:var(--dim);}
  .sig.frio i{background:var(--dim);animation:none;}

  .modo-pc .barra{display:flex;flex-wrap:nowrap;gap:14px;background:var(--surf);
    border:1.5px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:16px;}
  .modo-pc .sig{display:inline-flex;}
  .modo-pc .barra-sep{display:block;width:1px;height:18px;background:var(--line);}

  /* ── DENSIDADE DE MESA ────────────────────────────────────────
     O app de celular usa cantos muito arredondados e bastante ar —
     é certo no telefone e errado num painel de transmissão, onde se
     olha tudo de uma vez. No computador os cantos fecham e o espaço
     aperta, sem mudar nenhuma cor da marca. */
  .modo-pc .cln{border-radius:8px;padding:14px;gap:12px;}
  .modo-pc .tap{border-radius:8px;}
  .modo-pc .cenab{border-radius:5px;padding:11px;}
  .modo-pc .btn{border-radius:6px;}
  .modo-pc .seg{border-radius:6px;}
  .modo-pc .seg button{border-radius:4px;}
  .modo-pc .input{border-radius:6px;padding:10px 12px;}
  .modo-pc .agrow{border-radius:6px;}
  .modo-pc .tv{border-radius:6px;}
  .modo-pc .panel{border-radius:10px;}

  /* ── BOTOEIRA DE CENAS ────────────────────────────────────────
     Mesa de corte de verdade: botões lado a lado num barramento só,
     com luz de tally em cima. A que está no ar acende; as outras
     ficam apagadas esperando. No celular nada disto vale e a grade
     de botões continua como era. */
  .tally{display:none;}
  .modo-pc .cenas.bus{display:flex;gap:4px;background:var(--ink);
    border:1.5px solid var(--line);border-radius:6px;padding:4px;}
  .modo-pc .cenas.bus .cenab{flex:1;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:9px;padding:16px 6px 14px;border:none;border-radius:4px;
    background:var(--surf);font-size:11px;letter-spacing:.14em;color:var(--label);}
  .modo-pc .cenas.bus .tally{display:block;width:26px;height:4px;border-radius:2px;
    background:var(--line);transition:background .12s, box-shadow .12s;}
  .modo-pc .cenas.bus .cenab:hover{background:#242424;color:var(--white);}
  .modo-pc .cenas.bus .cenab.on{background:var(--orange);color:var(--ink);font-weight:700;}
  .modo-pc .cenas.bus .cenab.on .tally{background:var(--ink);
    box-shadow:0 0 10px rgba(255,102,0,.9);}
  .modo-pc .cenas.bus .cenab .tecla{border-color:rgba(255,255,255,.18);}
  .modo-pc .cenas.bus .cenab.on .tecla{border-color:rgba(13,13,13,.35);color:rgba(13,13,13,.75);}

  /* o replay é disparo, não cena: fica fora do barramento */
  .modo-pc .disparo{width:100%;border:1.5px dashed var(--line);border-radius:6px;
    padding:13px;background:none;color:var(--label);font-size:11px;letter-spacing:.14em;}
  .modo-pc .disparo:hover{border-color:var(--orange);color:var(--orange);}
  .modo-pc .disparo:disabled{opacity:.4;}

  /* o título de cada coluna, como etiqueta de rack */
  .modo-pc .cln>.stack>.mono:first-child,
  .modo-pc .cln>.stack>.row>.mono:first-child{color:var(--label);}

  /* botão de alternar a visualização */
  .btn-vis{display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);
    border-radius:999px;padding:7px 13px;color:var(--label);background:none;
    font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.12em;
    cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;}
  .btn-vis:hover{color:var(--white);border-color:var(--dim);}
  .btn-vis:active{transform:scale(.96);}
  .lock{display:flex;align-items:center;gap:9px;margin-bottom:20px;}
  .marca{background:none;border:none;padding:0;margin-bottom:20px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .marca:active{transform:scale(.96);}
  .marca:focus-visible{outline:2px solid var(--orange);outline-offset:4px;border-radius:8px;}
  .meter{display:flex;align-items:flex-end;gap:3px;height:20px;}
  .meter i{width:5px;border-radius:999px;background:var(--line);display:block;}
  .meter i.on{background:var(--orange);}
  .lock-word{font-family:var(--fd);font-size:19px;letter-spacing:-.03em;}
  .lock-word b{color:var(--orange);font-weight:inherit;}
  .h1{font-family:var(--fd);font-size:28px;letter-spacing:-.03em;line-height:1.1;}
  .mono{font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--label);}
  .body-sm{font-size:14px;color:var(--label);}
  .card{background:var(--surf);border-radius:20px;padding:16px;}
  .panel{background:var(--surf);border-radius:24px;padding:20px;}
  .stack{display:flex;flex-direction:column;gap:12px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .field{display:flex;flex-direction:column;gap:8px;}
  .field>label{font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--label);}
  textarea.input{font-family:var(--fm);font-size:14px;line-height:1.6;resize:vertical;}
  .input{background:var(--surf);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;font-size:16px;color:var(--white);width:100%;outline:none;}
  .input:focus{border-color:var(--orange);}
  .input::placeholder{color:var(--dim);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:16px 22px;font-size:16px;font-weight:700;}
  .btn:active{transform:scale(.97);} .btn:disabled{opacity:.4;}
  .btn-p{background:var(--orange);color:var(--ink);}
  .btn-q{border:1.75px solid var(--line);color:var(--white);font-weight:600;padding:14px 20px;}
  .btn-full{width:100%;}
  .seg{display:flex;background:var(--surf);border-radius:999px;padding:5px;gap:6px;}
  .seg button{flex:1;border-radius:999px;padding:10px;font-family:var(--fd);font-size:16px;color:var(--label);}
  .seg button.on{background:var(--white);color:var(--ink);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  /* fila de jogos */
  .agrow{background:var(--surf);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;}
  .agrow .qd{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px;}
  .agrow .cab{font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--label);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .agrow .du{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .agrow .jg{flex:none;background:var(--orange);color:var(--ink);border-radius:999px;padding:8px 14px;
    font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.12em;}
  .agrow .x{flex:none;color:var(--danger);font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.12em;padding:6px;}
  .agrow.pronto .du{color:var(--dim);}
  .agrow .res{flex:none;font-family:var(--fm);font-size:13px;color:var(--orange);}
  .hidden{display:none !important;}
  .tap{background:var(--surf);border-radius:20px;padding:20px;text-align:left;width:100%;}
  .tap.lead{border:1.5px solid var(--orange);}
  .big{font-family:var(--fd);font-size:64px;line-height:.85;letter-spacing:-.04em;}
  .srvgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .srvb{background:var(--surf);border:1.5px solid var(--line);border-radius:14px;padding:12px;
    font-size:15px;font-weight:600;color:var(--label);text-align:center;}
  .srvb.on{border-color:var(--orange);color:var(--orange);}
  .adj{display:flex;align-items:center;gap:8px;}
  .adjb{width:44px;height:44px;border-radius:999px;border:1.5px solid var(--line);
    font-family:var(--fd);font-size:20px;color:var(--white);display:flex;align-items:center;justify-content:center;}
  .adjb:active{border-color:var(--orange);color:var(--orange);}
  .cenas{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .cenab{background:var(--surf);border:1.5px solid var(--line);border-radius:14px;padding:13px;
    font-family:var(--fm);font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--label);text-align:center;}
  .cenab.on{background:var(--orange);border-color:var(--orange);color:var(--ink);}
  details{background:var(--surf);border-radius:16px;padding:14px 16px;}
  summary{font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--label);cursor:pointer;}
  details[open] summary{margin-bottom:14px;}
  .warn{background:rgba(255,102,0,.12);border:1.5px solid var(--orange);border-radius:16px;padding:14px 16px;font-size:14px;}

  /* ═════════ MODO OVERLAY (OBS · 1920×1080) ═════════ */
  body.ov{background:transparent;overflow:hidden;}
  /* Palco fixo de 1920×1080. Tudo dentro é medido em pixels de Full HD;
     o escalar() só encolhe o conjunto inteiro para caber na janela, então
     a proporção nunca muda. No OBS, com fonte 1920×1080, a escala é 1:1. */
  .stage{position:fixed;left:0;top:0;width:1920px;height:1080px;transform-origin:top left;--esc:.6;   /* tamanho do placar na transmissão */
    --pulso:1.7s; --curva:cubic-bezier(.45,0,.55,1);}
  .ov *{font-kerning:none;}

  /* Cada peça mora numa âncora. A âncora é que encolhe (--esc), com a
     origem no canto a que ela pertence — assim mudar o tamanho não
     desgruda nada da borda da tela. O elemento de dentro fica livre
     para usar transform nas animações, sem brigar com a escala. */
  .anc{position:absolute;transform:scale(var(--esc));}
  .anc.tl{transform-origin:top left;}
  .anc.tr{transform-origin:top right;}
  .anc.bl{transform-origin:bottom left;}
  .anc.br{transform-origin:bottom right;}

  /* ═════════ ANIMAÇÕES · vocabulário do design ═════════ */
  /* entrada */
  @keyframes bugIn{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
  @keyframes faixaIn{from{transform:translateY(36px);opacity:0}to{transform:none;opacity:1}}
  @keyframes cartaoIn{from{transform:translateY(48px) scale(.97);opacity:0}to{transform:none;opacity:1}}
  /* O design anima o letter-spacing na entrada do selo. Isso recalcula o
     layout do texto a cada quadro — em corpo 128px trava visivelmente.
     Mesmo efeito de "abrir", feito só com transform e opacidade, que o
     navegador resolve na placa de vídeo. */
  @keyframes seloIn{
    0%{transform:scale(1.28);opacity:0}
    55%{transform:scale(.985);opacity:1}
    100%{transform:none;opacity:1}}
  @keyframes regraIn{from{transform:scaleX(0)}to{transform:none}}
  /* saída */
  @keyframes bugOut{from{transform:none;opacity:1}to{transform:translateX(-40px);opacity:0}}
  @keyframes faixaOut{from{transform:none;opacity:1}to{transform:translateY(36px);opacity:0}}
  @keyframes cartaoOut{from{transform:none;opacity:1}to{transform:translateY(-40px) scale(.97);opacity:0}}
  @keyframes seloOut{from{transform:none;opacity:1}to{transform:scale(.86);opacity:0}}
  /* troca de valor */
  @keyframes numFlip{0%{transform:translateY(18px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
  @keyframes celaFlash{0%{background:var(--orange);color:var(--ink)}100%{background:var(--surf);color:var(--orange)}}
  @keyframes celaFlashG{0%{background:var(--orange);color:var(--ink)}100%{background:var(--surf);color:var(--white)}}
  /* contínuas */
  @keyframes vivoPisca{0%,100%{opacity:1}50%{opacity:.25}}
  /* Pulso do quarentão. O fundo é uma camada laranja que só muda de
     opacidade — a placa de vídeo dá conta sozinha, sem repintar a cela.
     Fundo, texto e anel usam a MESMA duração e a mesma curva, então
     pulsam juntos em vez de brigar entre si. */
  @keyframes ouroFundo{0%,100%{opacity:0}50%{opacity:1}}
  @keyframes ouroTexto{0%,100%{color:var(--orange)}50%{color:var(--ink)}}
  @keyframes anelPulsa{0%,100%{opacity:.2}50%{opacity:1}}
  @keyframes replayVarre{0%{transform:translateY(-102%)}30%{transform:none}66%{transform:none}100%{transform:translateY(102%)}}
  @keyframes fadeIn{to{opacity:1}}
  @keyframes fadeOut{to{opacity:0}}

  /* — SCOREBUG — */
  .bug{display:flex;gap:3px;align-items:stretch;
    animation:bugIn .5s cubic-bezier(.2,.8,.2,1) .1s both;}
  .bug.out{animation:bugOut .35s ease forwards;}

  .mk{background:var(--ink);padding:20px 22px;display:flex;flex-direction:column;gap:12px;justify-content:center;}
  .mk .meter{height:26px;gap:4px;}
  .mk .meter i{width:7px;}
  .mk .wm{font-family:var(--fd);font-size:24px;letter-spacing:-.03em;color:var(--white);}
  .mk .wm b{color:var(--orange);font-weight:inherit;}

  .nms{background:var(--surf);width:560px;display:flex;flex-direction:column;gap:3px;}
  .nrow{padding:16px 26px;display:flex;align-items:center;gap:20px;background:var(--surf);flex:1;}
  .dot{width:16px;height:16px;border-radius:999px;background:var(--line);flex-shrink:0;transition:background .2s,box-shadow .2s;}
  .nrow.srv .dot{background:var(--orange);box-shadow:0 0 16px rgba(255,102,0,.85);}
  .nnm{font-family:var(--fd);font-size:38px;letter-spacing:-.02em;color:var(--white);flex:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .setbox{display:flex;gap:10px;}
  .setbox span{width:34px;height:34px;display:flex;align-items:center;justify-content:center;
    font-family:var(--fm);font-size:24px;background:var(--line);color:var(--label);}
  .setbox span.won{background:var(--orange);color:var(--ink);font-weight:700;}
  .setbox span.lost{background:var(--line);color:var(--white);font-weight:700;}

  .col{display:flex;flex-direction:column;gap:3px;}
  .gm{background:var(--surf);width:92px;flex:1;display:flex;align-items:center;justify-content:center;
    font-family:var(--fd);font-size:40px;letter-spacing:-.03em;color:var(--white);}
  .ptcol{position:relative;}
  .pt{background:var(--surf);width:132px;flex:1;display:flex;align-items:center;justify-content:center;
    font-family:var(--fd);font-size:46px;letter-spacing:-.04em;color:var(--orange);}
  .gm span,.pt span{display:block;}

  /* marcador de quem saca */
  .ptmark{position:absolute;left:0;right:0;height:calc(50% - 1.5px);border:3px solid var(--orange);
    pointer-events:none;transition:top .25s cubic-bezier(.3,1,.4,1);z-index:2;}

  /* troca de valor: a cela pisca, o número sobe */
  .flip{animation:numFlip .34s cubic-bezier(.2,.8,.2,1);}
  .pt.flash{animation:celaFlash .5s ease-out;}
  .gm.flash{animation:celaFlashG .5s ease-out;}

  /* ponto de ouro (quarentão): anel pulsando + celas invertendo */
  .pt{position:relative;}
  .pt::after{content:'';position:absolute;inset:0;background:var(--orange);opacity:0;z-index:0;}
  .pt span{position:relative;z-index:1;}
  .anel{position:absolute;inset:-6px;border:3px solid var(--orange);pointer-events:none;
    display:none;z-index:1;}
  .ptcol.ouro .anel{display:block;will-change:opacity;
    animation:anelPulsa var(--pulso) var(--curva) infinite;}
  .ptcol.ouro .pt::after{will-change:opacity;animation:ouroFundo var(--pulso) var(--curva) infinite;}
  .ptcol.ouro .pt span{animation:ouroTexto var(--pulso) var(--curva) infinite;}

  /* — PÍLULAS ABAIXO DO BUG — */
  /* Placar e detalhes moram na MESMA âncora: assim a distância entre
     eles encolhe junto com o resto. Antes eram duas âncoras, cada uma
     escalando do próprio canto — e quanto menor o placar, maior o
     buraco entre ele e as pílulas. */
  .hud-topo{display:flex;flex-direction:column;align-items:flex-start;gap:14px;}
  .pills{display:flex;gap:10px;
    animation:faixaIn .5s cubic-bezier(.2,.8,.2,1) .25s both;}
  .pl{padding:10px 16px;font-family:var(--fm);font-size:24px;letter-spacing:.14em;display:flex;align-items:center;gap:9px;}
  .pl-live{background:var(--orange);color:var(--ink);font-weight:700;}
  .pl-live i{width:10px;height:10px;border-radius:999px;background:var(--ink);display:block;
    animation:vivoPisca 1.4s steps(2,jump-none) infinite;}
  .pl-dark{background:var(--ink);color:var(--white);}
  /* o quarentão é uma tarja discreta logo abaixo do placar, não um selo de tela cheia */
  .pl-ouro{background:var(--ink);color:var(--orange);font-weight:700;letter-spacing:.16em;
    animation:faixaIn .38s cubic-bezier(.2,.8,.2,1);}
  /* entrada discreta: sobe um nada e aparece, sem chamar atenção */
  .pl.entra{animation:tempoEntra .55s cubic-bezier(.2,.8,.2,1);}
  @keyframes tempoEntra{
    0%  {opacity:0;transform:translateY(7px) scale(.97)}
    100%{opacity:1;transform:none}}
  .pills.out{animation:faixaOut .35s ease forwards;}

  /* — RODAPÉ DE SETS — */
  .setline{background:var(--ink);padding:14px 20px;
    font-family:var(--fm);font-size:24px;letter-spacing:.14em;color:var(--label);
    animation:faixaIn .5s cubic-bezier(.2,.8,.2,1) .35s both;}
  .setline.out{animation:faixaOut .35s ease forwards;}

  /* — SELO DE TENSÃO (direita) — */
  .tens{display:flex;flex-direction:column;align-items:flex-end;
    opacity:0;pointer-events:none;}
  .tens.show{animation:seloIn .55s cubic-bezier(.2,.8,.2,1) forwards;}
  .tens.hide{animation:seloOut .3s ease forwards;}
  .tens .big{background:var(--orange);padding:22px 34px 26px;font-family:var(--fd);font-size:128px;
    line-height:.86;letter-spacing:-.05em;color:var(--ink);text-align:right;}
  .tens .sub{background:var(--ink);padding:16px 24px;font-family:var(--fm);font-size:30px;font-weight:700;
    letter-spacing:.18em;color:var(--white);}

  /* — QUEBRA DE SAQUE (canto inferior esquerdo) — */
  .brk{display:flex;flex-direction:column;gap:3px;align-items:flex-start;
    opacity:0;pointer-events:none;}
  .brk.show{animation:faixaIn .45s cubic-bezier(.2,.8,.2,1) forwards;}
  .brk.hide{animation:faixaOut .35s ease forwards;}
  .brk .w1{background:var(--ink);padding:18px 24px;font-family:var(--fd);font-size:44px;letter-spacing:-.03em;color:var(--orange);}
  .brk .w2{background:var(--ink);padding:22px 24px;font-family:var(--fm);font-size:28px;letter-spacing:.16em;color:var(--label);}

  /* — CARTELA DE ABERTURA DA PARTIDA — */
  .ident{display:flex;flex-direction:column;align-items:flex-start;
    opacity:0;}
  .ident.show{animation:faixaIn .55s cubic-bezier(.2,.8,.2,1) forwards;}
  .ident.hide{animation:faixaOut .4s ease forwards;}
  .ident .torn{background:var(--orange);padding:12px 22px;font-family:var(--fm);font-size:26px;font-weight:700;letter-spacing:.2em;color:var(--ink);}
  .ident .box{background:var(--ink);padding:24px 28px 26px;display:flex;flex-direction:column;gap:16px;}
  .ident .cat{font-family:var(--fd);font-size:84px;line-height:.9;letter-spacing:-.04em;color:var(--white);}
  .ident .fase{font-family:var(--fd);font-size:56px;line-height:.9;letter-spacing:-.03em;color:var(--orange);}
  .ident .bar{background:var(--orange);height:4px;transform-origin:left;}
  .ident.show .bar{animation:regraIn .5s cubic-bezier(.2,.8,.2,1) .1s both;}
  .ident .meta{font-family:var(--fm);font-size:26px;letter-spacing:.16em;color:var(--label);display:flex;gap:24px;}
  .brandTR{background:var(--ink);padding:16px 22px;display:flex;align-items:center;gap:16px;}

  /* — REPLAY — */
  .rep{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;}
  .rep.show{animation:fadeIn .12s ease forwards;}
  .rep.hide{animation:fadeOut .3s ease forwards;}
  /* cortina: o medidor de nível varrendo a tela de cima a baixo */
  .rep .bars{position:absolute;inset:0;display:flex;gap:6px;padding:0 6px;overflow:hidden;z-index:1;}
  .rep .bars i{flex:1;background:var(--orange);border-radius:999px 999px 0 0;display:block;
    animation:replayVarre 2.6s cubic-bezier(.16,1,.3,1) both;}
  .rep .bars i:last-child{background:var(--ink);}
  .rep .bars i:nth-child(2){animation-delay:.08s} .rep .bars i:nth-child(3){animation-delay:.16s}
  .rep .bars i:nth-child(4){animation-delay:.24s} .rep .bars i:nth-child(5){animation-delay:.32s}
  /* a palavra fica ACIMA da cortina, e tem entrada e saída próprias:
     aparece com a tela já coberta e sai antes de a cortina abrir */
  .rep .box{background:var(--ink);padding:30px 44px;display:flex;align-items:center;gap:28px;
    position:relative;z-index:2;}
  .rep.show .box{animation:repPalavra 2.6s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes repPalavra{
    0%,14%  {opacity:0;transform:scale(1.22)}
    30%,60% {opacity:1;transform:none}
    80%,100%{opacity:0;transform:scale(.93)}
  }
  .rep .mtr{display:flex;align-items:flex-end;gap:8px;height:62px;}
  .rep .mtr i{width:16px;border-radius:999px;background:var(--orange);display:block;}
  .rep .mtr i:last-child{background:var(--line);}
  .rep .w{font-family:var(--fd);font-size:96px;line-height:.9;letter-spacing:-.045em;color:var(--white);}


  /* — AGENDA · resultados e próximos jogos — */
  .agdw{position:absolute;inset:0;background:rgba(13,13,13,.66);opacity:0;pointer-events:none;}
  .agdw.show{animation:fadeIn .4s ease forwards;}
  .agdw.hide{animation:fadeOut .35s ease forwards;}
  .agd{position:absolute;left:64px;right:64px;top:110px;display:flex;flex-direction:column;gap:26px;}
  .agdw.show .agd{animation:cartaoIn .6s cubic-bezier(.2,.8,.2,1) .1s both;}
  .agd .hd{display:flex;align-items:center;gap:18px;}
  .agd .hd .tag{background:var(--orange);padding:12px 22px;font-family:var(--fm);font-size:28px;
    font-weight:700;letter-spacing:.2em;color:var(--ink);}
  .agd .hd .tn{font-family:var(--fm);font-size:26px;letter-spacing:.16em;color:var(--white);}
  .agd .cols{display:flex;gap:24px;align-items:flex-start;}
  .agd .cl{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;}
  .agd .ct{font-family:var(--fm);font-size:26px;letter-spacing:.18em;color:var(--label);}
  .agd .ct.on{color:var(--orange);}
  .agd .it{background:var(--ink);padding:18px 22px;display:flex;flex-direction:column;gap:10px;}
  .agd .it.now{border:3px solid var(--orange);padding:21px 22px;}
  .agd .top{display:flex;align-items:center;justify-content:space-between;gap:18px;}
  .agd .hr{font-family:var(--fd);font-size:30px;letter-spacing:-.03em;color:var(--white);}
  .agd .it.now .hr{color:var(--orange);}
  .agd .cx{font-family:var(--fm);font-size:23px;letter-spacing:.16em;color:var(--label);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .agd .ln{display:flex;align-items:center;justify-content:space-between;gap:18px;}
  .agd .du{font-family:var(--fd);font-size:30px;letter-spacing:-.02em;color:var(--white);
    text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
  .agd .du.venceu{color:var(--orange);}
  .agd .du.perdeu{color:var(--dim);}
  .agd .sc{font-family:var(--fm);font-size:25px;color:var(--white);white-space:nowrap;}
  .agd .sc.perdeu{color:var(--dim);}
  .agd .rule{height:2px;background:var(--line);}
  .agd .vaz{font-family:var(--fm);font-size:24px;letter-spacing:.16em;color:var(--dim);padding:16px 0;}

  /* — SELO DE PATROCÍNIO NO CANTO (fica durante o jogo) — */
  .apo{display:flex;align-items:stretch;gap:3px;}
  .apo .rot{background:var(--ink);padding:14px 18px;display:flex;align-items:center;
    font-family:var(--fm);font-size:24px;letter-spacing:.16em;color:var(--label);white-space:nowrap;}
  .apo .marca{background:var(--white);padding:12px 22px;display:flex;align-items:center;justify-content:center;
    min-width:160px;}
  .apo .marca img{height:44px;max-width:220px;object-fit:contain;display:block;}
  .apo .marca .txt{font-family:var(--fd);font-size:30px;letter-spacing:-.03em;color:var(--ink);white-space:nowrap;}
  .apo.troca{animation:apoTroca .5s cubic-bezier(.2,.8,.2,1);}
  .apo.out{animation:faixaOut .35s ease forwards;}
  @keyframes apoTroca{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}

  /* — SELO DE REPLAY — fica enquanto o corte roda, para ninguém achar
       que é jogo ao vivo. O placar some junto, porque estaria errado. */
  .selo-rep{display:flex;align-items:center;gap:12px;background:var(--orange);
    color:var(--ink);padding:14px 22px;font-family:var(--fm);font-size:26px;
    font-weight:700;letter-spacing:.2em;animation:faixaIn .4s cubic-bezier(.2,.8,.2,1);}
  .selo-rep i{width:12px;height:12px;border-radius:999px;background:var(--ink);display:block;
    animation:vivoPisca 1.4s steps(2,jump-none) infinite;}

  /* — PATROCÍNIO — */
  .spo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(13,13,13,.72);opacity:0;pointer-events:none;}
  .spo.show{animation:fadeIn .45s ease forwards;}
  .spo.hide{animation:fadeOut .35s ease forwards;}
  .spo.show .box{animation:cartaoIn .55s cubic-bezier(.2,.8,.2,1) .1s both;}
  .spo .box{background:var(--ink);padding:40px 36px;display:flex;flex-direction:column;gap:30px;max-width:1200px;}
  .spo .lb{font-family:var(--fm);font-size:28px;font-weight:700;letter-spacing:.2em;color:var(--orange);}
  .spo .nm{font-family:var(--fd);font-size:64px;line-height:.95;letter-spacing:-.04em;color:var(--white);}
  .spo .marcas{display:flex;flex-wrap:wrap;gap:3px;}
  .spo .marcas .m{background:var(--white);padding:18px 26px;display:flex;align-items:center;justify-content:center;min-width:200px;}
  .spo .marcas .m img{height:76px;max-width:280px;object-fit:contain;display:block;}
  .spo .marcas .m .txt{font-family:var(--fd);font-size:34px;letter-spacing:-.03em;color:var(--ink);}
  .spo .ft{display:flex;align-items:center;gap:16px;}
  .spo .ft .wm{font-family:var(--fd);font-size:24px;letter-spacing:-.03em;color:var(--white);}
  .spo .ft .wm b{color:var(--orange);font-weight:inherit;}
  .spo .ft .tn{font-family:var(--fm);font-size:24px;letter-spacing:.16em;color:var(--label);}

  /* — ESTATÍSTICAS —
     Mesmo esqueleto do PATROCÍNIO: véu escuro e um cartão no meio. Três
     colunas por linha — dupla de cima, rótulo, dupla de baixo — porque é
     assim que se lê um confronto: um contra o outro, olhando para o meio.
     Quem está na frente naquela estatística fica laranja. */
  .sta{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(13,13,13,.72);opacity:0;pointer-events:none;}
  .sta.show{animation:fadeIn .45s ease forwards;}
  .sta.hide{animation:fadeOut .35s ease forwards;}
  .sta.show .box{animation:cartaoIn .55s cubic-bezier(.2,.8,.2,1) .1s both;}
  .sta .box{background:var(--ink);padding:40px 48px;display:flex;flex-direction:column;gap:22px;width:1240px;}
  .sta .hd{display:flex;align-items:center;gap:18px;min-width:0;}
  .sta .hd .tag{background:var(--orange);color:var(--ink);padding:12px 22px;font-family:var(--fm);
    font-size:26px;font-weight:700;letter-spacing:.2em;white-space:nowrap;}
  .sta .hd .ctx{font-family:var(--fm);font-size:24px;letter-spacing:.16em;color:var(--label);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sta .duplas{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  .sta .duplas .du{font-family:var(--fd);font-size:46px;line-height:1;letter-spacing:-.04em;color:var(--white);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sta .duplas .du.b{text-align:right;}
  .sta .ln{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;
    padding:15px 0;border-top:2px solid var(--line);}
  .sta .rot{font-family:var(--fm);font-size:22px;letter-spacing:.18em;color:var(--label);text-align:center;white-space:nowrap;}
  .sta .v{font-family:var(--fd);font-size:44px;line-height:1;letter-spacing:-.03em;color:var(--white);}
  .sta .v.b{text-align:right;}
  .sta .v small{font-family:var(--fm);font-size:22px;letter-spacing:.06em;color:var(--label);margin:0 12px;}
  .sta .v.lid{color:var(--orange);}
  .sta .ft{display:flex;align-items:center;gap:16px;}
  .sta .ft .wm{font-family:var(--fd);font-size:24px;letter-spacing:-.03em;color:var(--white);}
  .sta .ft .wm b{color:var(--orange);font-weight:inherit;}

  /* — FIM DE JOGO — */
  .veil{position:absolute;inset:0;background:rgba(13,13,13,.6);opacity:0;}
  .fim{position:absolute;left:64px;right:64px;top:140px;display:flex;flex-direction:column;gap:26px;opacity:0;}
  .veil.show{animation:fadeIn .5s ease forwards;}
  .fim.show{animation:cartaoIn .6s cubic-bezier(.2,.8,.2,1) .12s forwards;}
  .fim.hide{animation:cartaoOut .4s ease forwards;}
  .veil.hide{animation:fadeOut .4s ease forwards;}
  .fim .hd{display:flex;align-items:center;gap:18px;}
  .fim .hd .tag{background:var(--orange);padding:12px 22px;font-family:var(--fm);font-size:28px;font-weight:700;letter-spacing:.2em;color:var(--ink);}
  .fim .hd .ctx{font-family:var(--fm);font-size:26px;letter-spacing:.16em;color:var(--white);}
  .fim .box{background:var(--ink);padding:34px 34px 36px;display:flex;flex-direction:column;gap:24px;}
  .fim .ln{display:flex;align-items:center;gap:28px;}
  .fim .who{font-family:var(--fd);font-size:88px;line-height:.92;letter-spacing:-.045em;flex:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fim .ln.win .who{color:var(--white);} .fim .ln.lose .who{color:var(--label);}
  .fim .sets{display:flex;gap:10px;}
  .fim .sets span{width:108px;height:108px;display:flex;align-items:center;justify-content:center;
    font-family:var(--fd);font-size:64px;letter-spacing:-.04em;background:var(--line);color:var(--white);}
  .fim .sets span.w{background:var(--orange);color:var(--ink);}
  .fim .vc{background:var(--orange);padding:10px 18px;font-family:var(--fm);font-size:26px;font-weight:700;letter-spacing:.16em;color:var(--ink);}
  .fim .vd{padding:10px 18px;font-family:var(--fm);font-size:26px;letter-spacing:.16em;color:var(--dim);}
  .fim .rule{background:var(--line);height:3px;}
  .fim .ft{font-family:var(--fm);font-size:26px;letter-spacing:.16em;color:var(--white);display:flex;gap:16px;}
  .fim .ft b{color:var(--orange);font-weight:400;}

  /* O OBS entrega a página sobre o vídeo: fundo transparente, sem rolagem. */
  html,body{background:transparent;margin:0;overflow:hidden;}
  body{width:1920px;height:1080px;}
  .stage{display:block !important;}
  /* Solta, cada peça sai no tamanho de desenho. Os 60% do placar ao vivo
     existem para ele conviver com o jogo; aqui quem redimensiona é você,
     na própria fonte do OBS. Dá para forçar outro valor com ?escala= */
  .stage{--esc:1;}
  /* fora do ar até a peça escolhida ser ligada */
  .peca-off{display:none !important;}
</style>

  </div>

  <div class="anc tr" style="right:64px;top:56px">
    <div class="selo-rep hidden" id="ovSeloRep"><i></i>REPLAY</div>
  </div>

  <div class="anc tr" style="right:64px;top:300px">
  <div class="tens" id="ovTens"><div class="big" id="ovTensBig"></div><div class="sub" id="ovTensSub"></div></div>
  </div>

  <div class="anc bl" style="left:64px;bottom:96px">
  <div class="brk" id="ovBrk"><div class="w1">QUEBROU</div><div class="w2" id="ovBrkSub"></div></div>
  </div>

  <div class="anc bl" style="left:64px;bottom:96px">
  <div class="ident" id="ovIdent">
      <div class="torn" id="idTorn"></div>
      <div class="box">
        <div class="cat" id="idCat"></div>
        <div class="fase" id="idFase"></div>
        <div class="bar"></div>
        <div class="meta" id="idMeta"></div>
      </div>
    </div>
  </div>
  <div class="anc tr" style="right:64px;top:56px">
    <div class="brandTR hidden" id="ovBrandTR">
      <div class="meter" aria-hidden="true"><i class="on" style="height:11px"></i><i class="on" style="height:17px"></i><i class="on" style="height:22px"></i><i style="height:26px"></i></div>
      <div style="font-family:var(--fd);font-size:24px;letter-spacing:-.03em">LEVEL<span style="color:var(--orange)">BT</span></div>
    </div>
  </div>

  <div class="rep" id="ovRep">
    <div class="bars"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="box">
      <div class="mtr"><i style="height:26px"></i><i style="height:38px"></i><i style="height:50px"></i><i style="height:62px"></i></div>
      <div class="w">REPLAY</div>
    </div>
  </div>

  <div class="spo" id="ovSpo">
    <div class="box">
      <div class="lb">APRESENTADO POR</div>
      <div class="nm" id="spoNome">—</div>
      <div class="marcas hidden" id="spoMarcas"></div>
      <div class="ft">
        <div class="meter" style="height:26px;gap:4px"><i class="on" style="width:7px;height:11px"></i><i class="on" style="width:7px;height:17px"></i><i class="on" style="width:7px;height:22px"></i><i style="width:7px;height:26px"></i></div>
        <div class="wm">LEVEL<b>BT</b></div>
        <div class="tn" id="spoTorn"></div>
      </div>
    </div>
  </div>

  <div class="sta" id="ovSta">
    <div class="box">
      <div class="hd"><div class="tag">ESTATÍSTICAS</div><div class="ctx" id="staCtx"></div></div>
      <div class="duplas"><div class="du" id="staA">—</div><div class="du b" id="staB">—</div></div>
      <div id="staLinhas"></div>
      <div class="ft">
        <div class="meter" style="height:26px;gap:4px"><i class="on" style="width:7px;height:11px"></i><i class="on" style="width:7px;height:17px"></i><i class="on" style="width:7px;height:22px"></i><i style="width:7px;height:26px"></i></div>
        <div class="wm">LEVEL<b>BT</b></div>
      </div>
    </div>
  </div>

  <div class="agdw" id="ovAgd">
    <div class="agd">
      <div class="hd"><div class="tag">PRÓXIMOS JOGOS</div><div class="tn" id="agdTorn"></div></div>
      <div class="cols">
        <div class="cl"><div class="ct">JÁ JOGADOS</div><div id="agdFeitos" class="cl"></div></div>
        <div class="cl"><div class="ct on">A SEGUIR</div><div id="agdProx" class="cl"></div></div>
      </div>
    </div>
  </div>

  <div class="fim" id="ovFim">
    <div class="hd"><span class="tag">FIM DE JOGO</span><span class="ctx" id="fCtx"></span></div>
    <div class="box">
      <div class="ln win"><div class="who" id="fW1"></div><div class="sets" id="fS1"></div><span class="vc">VENCEU</span></div>
      <div class="rule"></div>
      <div class="ln lose"><div class="who" id="fW2"></div><div class="sets" id="fS2"></div><span class="vd">—</span></div>
    </div>
    <div class="ft" id="fFt"></div>
  </div>
</div>

<script>
// ── Qual peça, e com que texto ────────────────────────────────────
// Tudo vem do endereço, para você montar a fonte do OBS sem mexer em
// código. Exemplo:
//   pecas.html?peca=cartela&torneio=COPA%20VERAO&cat=MISTA%20A&fase=FINAL
const qs=new URLSearchParams(location.search);
const $=id=>document.getElementById(id);
const txt=(id,v)=>{ const e=$(id); if(e) e.textContent=v; };
const p=(nome,padrao)=>{ const v=qs.get(nome); return (v===null||v==='') ? padrao : v; };

const PECA=(qs.get('peca')||'replay').toLowerCase();
const LOOP=qs.get('loop')==='1';
const ESPERA=Number(qs.get('espera')||0)*1000;   // atraso antes de entrar
const ESCALA=qs.get('escala');
if(ESCALA) document.documentElement.style.setProperty('--esc', ESCALA);

// Todas as peças do palco, e qual elemento é a raiz de cada uma.
const PECAS={
  replay   : {el:'ovRep',   dur:2600},
  cartela  : {el:'ovIdent', dur:0},
  patrocinio:{el:'ovSpo',   dur:0},
  proximos : {el:'ovAgd',   dur:0},
  fim      : {el:'ovFim',   dur:0, extra:['ovVeil']},
  selo     : {el:'ovTens',  dur:0},
  quebrou  : {el:'ovBrk',   dur:0},
  stats    : {el:'ovSta',   dur:0}
};

// Apaga tudo que não é a peça pedida. O palco inteiro vem do overlay,
// então sobra muita coisa — some com ela em vez de recortar o HTML.
function soAPeca(){
  const d=PECAS[PECA];
  if(!d){ document.body.innerHTML='<div style="color:#FF6600;font:700 28px sans-serif;padding:40px">'+
    'Peça desconhecida: '+PECA+'. Use uma destas: '+Object.keys(PECAS).join(', ')+'</div>'; return null; }
  const guardar=new Set([d.el].concat(d.extra||[]));
  [...document.querySelectorAll('.stage > *')].forEach(n=>{
    const dentro=[...guardar].some(id=>n.id===id || n.querySelector('#'+id));
    if(!dentro) n.classList.add('peca-off');
  });
  return d;
}

function preencher(){
  // ── cartela de abertura ──
  txt('idTorn', p('torneio','LEVEL BT').toUpperCase());
  txt('idCat',  p('cat','MISTA A').toUpperCase());
  txt('idFase', p('fase','FINAL').toUpperCase());
  const meta=[p('quadra',''), p('data','')].filter(Boolean)
    .map(x=>'<span>'+x.toUpperCase()+'</span>').join('');
  if($('idMeta')) $('idMeta').innerHTML=meta;

  // ── patrocínio ──
  txt('spoNome', p('patrocinador','SEU PATROCINADOR').toUpperCase());
  txt('spoTorn', p('torneio','').toUpperCase());
  const logo=p('logo','');
  if(logo && $('spoMarcas')){
    $('spoMarcas').classList.remove('hidden');
    $('spoMarcas').innerHTML='<div class="m"><img src="'+logo+'" alt=""></div>';
  }

  // ── selo de tensão ──
  const grande=p('texto','MATCH POINT').toUpperCase();
  if($('ovTensBig')) $('ovTensBig').innerHTML=grande.replace(' ','<br>');
  txt('ovTensSub', p('sub','QUEM FAZ, LEVA').toUpperCase());

  // ── quebra de saque ──
  txt('ovBrkSub', 'SAQUE DE '+p('perdeu','DUPLA').toUpperCase());

  // ── fim de jogo ──
  txt('fCtx', [p('torneio',''),p('cat',''),p('fase','')].filter(Boolean).join(' · ').toUpperCase());
  txt('fW1', p('venceu','Ana/Bia'));
  txt('fW2', p('perdeu','Cris/Dani'));
  const sets=p('sets','6-4 6-3').split(' ').filter(Boolean);
  const caixas=(lado)=>sets.map(s=>{
    const n=s.split('-'); const meu=n[lado], dele=n[1-lado];
    return '<span class="'+(Number(meu)>Number(dele)?'w':'')+'">'+meu+'</span>';
  }).join('');
  if($('fS1')) $('fS1').innerHTML=caixas(0);
  if($('fS2')) $('fS2').innerHTML=caixas(1);
  if($('fFt')) $('fFt').innerHTML=p('rodape','') ? '<span>'+p('rodape','').toUpperCase()+'</span>' : '';

  // ── estatísticas ──
  // Cada número entra como "dupla de cima,dupla de baixo":
  //   saque=24/32,18/29  devol=11/29,8/32  bp=2/5,1/3  seq=6,4  q=3,2
  //
  // SEM VALOR, TRAÇO. Diferente das outras peças, esta não tem exemplo
  // pronto: um número de mentira aqui seria uma estatística inventada
  // indo ao ar se alguém esquecer de preencher o endereço.
  txt('staCtx', [p('torneio',''),p('cat',''),p('fase','')].filter(Boolean).join(' · ').toUpperCase());
  txt('staA', p('a','—'));
  txt('staB', p('b','—'));
  // o endereço vira HTML aqui: escapa antes, para um "<" não virar marcação
  const esc=t=>String(t).replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
  const par=(nome)=>{ const v=p(nome,''); const x=v.split(',').map(y=>esc(y.trim()));
                      return [x[0]||'—', x[1]||'—']; };
  const razao=(f)=>{ const n=String(f).split('/').map(Number);
                     return n.length===2 && n[1]>0 ? n[0]/n[1] : -1; };
  const num=(f)=>{ const n=parseFloat(String(f).split('/')[0]); return isNaN(n)?-1:n; };
  const pct=(f)=>{ const r=razao(f); return r<0 ? '' : Math.round(r*100)+'%'; };
  // Mesma regra do overlay ao vivo: só destaca com dado dos DOIS lados.
  const lider=(a,b)=>(a<0||b<0||a===b) ? 0 : (a>b?1:2);
  const linhas=[
    ['PONTOS NO SAQUE',     par('saque'), 'pct'],
    ['PONTOS NA DEVOLUÇÃO', par('devol'), 'pct'],
    ['BREAK POINTS',        par('bp'),    'conv'],
    ['MAIOR SEQUÊNCIA',     par('seq'),   'num'],
    ['QUARENTÕES VENCIDOS', par('q'),     'num']
  ];
  if($('staLinhas')) $('staLinhas').innerHTML=linhas.map(([rot,[a,b],tipo])=>{
    const va = tipo==='pct' ? razao(a) : num(a);
    const vb = tipo==='pct' ? razao(b) : num(b);
    const l = lider(va,vb);
    const pa = tipo==='pct' ? pct(a) : '', pb = tipo==='pct' ? pct(b) : '';
    return '<div class="ln">'+
      '<div class="v a'+(l===1?' lid':'')+'">'+a+(pa?'<small>'+pa+'</small>':'')+'</div>'+
      '<div class="rot">'+rot+'</div>'+
      '<div class="v b'+(l===2?' lid':'')+'">'+(pb?'<small>'+pb+'</small>':'')+b+'</div></div>';
  }).join('');

  // ── próximos jogos ──
  txt('agdTorn', [p('torneio',''),p('quadra','')].filter(Boolean).join(' · ').toUpperCase());
  const linha=(j)=>{
    const c=j.split('|').map(x=>x.trim());
    const quando=c[0]||'', ctx=c[1]||'', a=c[2]||'—', b=c[3]||'—', placar=c[4]||'';
    return '<div class="it'+(placar?'':' now')+'">'+
      '<div class="top"><div class="hr">'+quando+'</div><div class="cx">'+ctx+'</div></div>'+
      '<div class="ln"><div class="du">'+a+'</div>'+(placar?'<div class="sc">'+placar+'</div>':'')+'</div>'+
      '<div class="rule"></div>'+
      '<div class="ln"><div class="du">'+b+'</div></div></div>';
  };
  const feitos=(qs.get('jogados')||'').split(';').filter(Boolean);
  const proxs =(qs.get('fila')||'').split(';').filter(Boolean);
  if($('agdFeitos')) $('agdFeitos').innerHTML = feitos.length
    ? feitos.map(linha).join('') : '<div class="vaz">AINDA NÃO HOUVE JOGO</div>';
  if($('agdProx')) $('agdProx').innerHTML = proxs.length
    ? proxs.map(linha).join('') : '<div class="vaz">SEM JOGOS NA FILA</div>';
}

// ── Entrada e saída ───────────────────────────────────────────────
// No OBS, marque "Atualizar navegador quando a cena ficar ativa" para a
// animação recomeçar toda vez que você cortar para a cena.
function tocar(d){
  const alvo=$(d.el);
  if(!alvo) return;
  (d.extra||[]).forEach(id=>{ const e=$(id); if(e){ e.classList.remove('hide'); e.classList.add('show'); } });
  alvo.classList.remove('hide');
  alvo.classList.add('show');
  if(d.el==='ovRep'){
    alvo.querySelectorAll('.bars i').forEach(i=>{ i.style.animation='none'; void i.offsetWidth; i.style.animation=''; });
  }
  if(d.dur>0){
    setTimeout(()=>{
      alvo.classList.remove('show'); alvo.classList.add('hide');
      (d.extra||[]).forEach(id=>{ const e=$(id); if(e){ e.classList.remove('show'); e.classList.add('hide'); } });
      if(LOOP) setTimeout(()=>tocar(d), 600);
    }, d.dur);
  }
}

const dados=soAPeca();
if(dados){
  preencher();
  setTimeout(()=>tocar(dados), ESPERA || 60);
}
</script>
</body>
